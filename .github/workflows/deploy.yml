name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a production deploy in progress.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can start a run from any branch, so production deploys are pinned to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Passkeys, cookies and the CSRF check are bound to the public origin, so a deploy
      # without it would ship an API that cannot sign anyone in.
      - name: Resolve auth origin
        shell: bash
        env:
          WEB_URL: ${{ vars.MISE_WEB_URL }}
        run: |
          if [ -z "$WEB_URL" ]; then
            echo "::error::Set the MISE_WEB_URL repository variable (e.g. https://mise-web.<account>.workers.dev)."
            exit 1
          fi
          auth_origin="${WEB_URL%/}"
          echo "AUTH_ORIGIN=$auth_origin" >> "$GITHUB_ENV"
          echo "AUTH_RP_ID=${auth_origin#https://}" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # Migrations run before the API deploy, so the schema is ready when the new code starts.
      # Keep migrations additive (expand now, contract in a later deploy) so the old API keeps
      # working against the new schema until its deploy finishes.
      - name: Apply D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm db:migrate:remote

      # The API goes first: mise-web's Service Binding needs mise-api to exist.
      - name: Deploy mise-api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # BETTER_AUTH_SECRET (and OWNER_BOOTSTRAP_TOKEN until the owner exists) are Worker
        # secrets set once with `wrangler secret put` (docs/runbook.md), never in this file.
        run: >-
          pnpm --filter api exec wrangler deploy
          --var "APP_VERSION:${GITHUB_SHA::7}"
          --var "AUTH_ORIGIN:${AUTH_ORIGIN}"
          --var "AUTH_RP_ID:${AUTH_RP_ID}"

      - name: Deploy mise-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web exec wrangler deploy

      # Proves the deployed Worker serves this commit, not just that some version answers.
      - name: Smoke test production
        shell: bash
        run: |
          expected_version="${GITHUB_SHA::7}"
          actual_version="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$AUTH_ORIGIN/api/health" | jq -r '.version')"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::Expected version $expected_version from $AUTH_ORIGIN/api/health but got $actual_version"
            exit 1
          fi
