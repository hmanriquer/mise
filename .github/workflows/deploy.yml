name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a production deploy in progress.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_dispatch can start a run from any branch, so production deploys are pinned to main.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      # D1 migrations (`wrangler d1 migrations apply mise --remote`) join this job in #3,
      # before the API deploy, so the schema is ready when the new code starts.

      # The API goes first: mise-web's Service Binding needs mise-api to exist.
      - name: Deploy mise-api
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter api exec wrangler deploy --var "APP_VERSION:${GITHUB_SHA::7}"

      - name: Deploy mise-web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter web exec wrangler deploy

      # Proves the deployed Worker serves this commit, not just that some version answers.
      - name: Smoke test production
        if: ${{ vars.MISE_WEB_URL != '' }}
        shell: bash
        env:
          WEB_URL: ${{ vars.MISE_WEB_URL }}
        run: |
          base_url="${WEB_URL%/}"
          expected_version="${GITHUB_SHA::7}"
          actual_version="$(curl -fsS --retry 5 --retry-delay 3 --retry-all-errors "$base_url/api/health" | jq -r '.version')"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "::error::Expected version $expected_version from $base_url/api/health but got $actual_version"
            exit 1
          fi

      - name: Skip smoke test
        if: ${{ vars.MISE_WEB_URL == '' }}
        run: echo "::notice::Smoke test skipped. Set the MISE_WEB_URL repository variable to enable it."
